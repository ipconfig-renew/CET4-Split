// Top-level build file where you can add configuration options common to all sub-projects/modules.

// 国内/受限网络友好：优先使用阿里云 Maven 镜像（覆盖 Google Maven 与 Maven Central）
def aliyunGoogle = 'https://maven.aliyun.com/repository/google'
def aliyunPublic = 'https://maven.aliyun.com/repository/public'
def aliyunGradle = 'https://maven.aliyun.com/repository/gradle-plugin'

buildscript {
    repositories {
        maven { url aliyunGradle }
        maven { url aliyunGoogle }
        maven { url aliyunPublic }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url aliyunGoogle }
        maven { url aliyunPublic }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
